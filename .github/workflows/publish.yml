name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  publish-maven:
    name: Publish Maven Artifact to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish Maven Package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd generators/java
          mvn clean deploy -B -DskipTests
        
  publish-npm:
    name: Publish npm Package to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@leandroamariles'
      - name: Build and Publish npm Package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd generators/npm
          npm ci
          npm run build
          npm publish

  verify-python-tag:
    name: Verify Python Tag for uv Installation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Verify Python Package Build
        run: |
          cd generators/python
          uv build
          echo "Python package verified. Resolvable by uv using git tag @${{ github.ref_name }}."
