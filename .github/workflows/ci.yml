name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  purity-and-format:
    name: Contracts Purity & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Contracts Purity
        run: bash scripts/verify-contracts-purity.sh

  openapi-compatibility:
    name: OpenAPI Compatibility (oasdiff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run OpenAPI Compatibility Check
        env:
          BASE_REF: ${{ github.base_ref || 'origin/main' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
        run: bash scripts/check-openapi-compatibility.sh

  avro-compatibility:
    name: Avro Schema Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Avro Compatibility Check
        run: bash scripts/check-avro-compatibility.sh

  package-generation-dry-run:
    name: Package Generation Dry-Run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Java DTOs Compilation Dry-Run
        run: cd generators/java && mvn clean compile -B
      - name: Angular Client Build Dry-Run
        run: cd generators/npm && npm ci && npm run build
      - name: Python Package Build Dry-Run
        run: cd generators/python && uv build
