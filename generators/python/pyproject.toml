[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shoplab-contracts"
version = "1.4.0"
description = "Typed Pydantic models generated from ShopLab OpenAPI contracts."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Leandro Amariles" }
]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7.0"
]

[project.urls]
Homepage = "https://github.com/leandroAmariles/shoplab-contracts"
Repository = "https://github.com/leandroAmariles/shoplab-contracts.git"

[tool.hatch.build.targets.wheel]
packages = ["src/shoplab_contracts"]
